# Escrow contract tests. Runs only when something under contracts/ changes.
name: contracts

on:
  pull_request:
    paths: ['contracts/**', '.github/workflows/contracts.yml']
  push:
    branches: [main]
    paths: ['contracts/**', '.github/workflows/contracts.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
