name: deploy-escrow-testnet

# Hand-run only. Deploys the escrow to Base Sepolia (testnet, play money)
# with a throwaway key made inside the run. Never deploys to mainnet.
on:
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Minutes to wait for free test ETH at the printed address"
        default: "40"
        required: true

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-escrow-testnet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm i --no-save ethers@6.15.0
      - run: npm test
      - run: npx hardhat build
      - run: node scripts/deploy-testnet.mjs
        env:
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escrow-base-sepolia-deployment
          path: contracts/deployment.json
          if-no-files-found: ignore
